    "oauthlib==3.2.2",
    "pathlib>=1.0.1",
    "pathvalidate>=3.3.1",
    "proto-plus==1.24.0",
    "protobuf==5.27.3",
    "pyasn1==0.6.0",
    "pyasn1-modules==0.4.0",
    "pyparsing==3.1.2",
